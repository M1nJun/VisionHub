spring.application.name=DashboardServer

# No serverTimezone conversion on purpose: MySQL's NOW()/CURRENT_TIMESTAMP store
# local wall-clock time (not UTC) on this system, and the Go receiver's own DSN
# (loc=Local) already reads/writes on that same convention. Setting
# serverTimezone=UTC here previously made this app misinterpret local timestamps
# as UTC, offsetting every heartbeat/event time by the machine's UTC offset and
# making agents appear falsely Offline.
spring.datasource.url=jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:vision_dashboard}?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:vision_app}
spring.datasource.password=${DB_PASSWORD:VisionAppDevPw!2026}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

server.port=${SERVER_PORT:8080}
server.servlet.context-path=/dashboard

logging.level.com.visionhub.dashboard=INFO
